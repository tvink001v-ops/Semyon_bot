<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { height: 100%; overflow: hidden; }
        .app { display: flex; width: 200vw; height: 100%; transition: transform 0.2s; }
        .screen { width: 100vw; height: 100%; display: flex; flex-direction: column; background: #f4f4f5; }
        .header { height: 50px; background: #507299; color: white; display: flex; align-items: center; padding: 0 15px; font-weight: bold; }
        .list { flex: 1; overflow-y: auto; background: white; }
        .item { padding: 15px; border-bottom: 1px solid #f0f2f5; cursor: pointer; }
        .chat-hdr { background: white; border-bottom: 1px solid #dadde1; }
        .back { background: none; border: none; font-size: 20px; color: #507299; padding: 10px; cursor: pointer; }
        .box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 15px; }
        .incoming { background: white; align-self: flex-start; }
        .outgoing { background: #effdde; align-self: flex-end; }
        .input { background: white; padding: 10px; display: flex; gap: 10px; border-top: 1px solid #dadde1; }
        .input input { flex: 1; padding: 10px; border: 1px solid #dbdbdb; border-radius: 20px; outline: none; }
        .input button { background: #4a90e2; color: white; border: none; padding: 0 15px; border-radius: 20px; cursor: pointer; }
        .view-chat .app { transform: translateX(-100vw); }
    </style>
</head>
<body>
    <div class="app">
        <div class="screen">
            <div class="header">Чаты</div>
            <div class="list" id="list"></div>
        </div>
        <div class="screen">
            <div class="header chat-hdr">
                <button class="back" onclick="go(0)">←</button>
                <span id="title" style="color:#000">Чат</span>
            </div>
            <div class="box" id="box"></div>
            <div class="input">
                <input type="text" id="inp" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') send()">
                <button onclick="send()">Отп.</button>
            </div>
        </div>
    </div>
    <script>
        const T = '9056510066:AAGsqMSqp9XiJynAmfI8V90NA3gnMvsX5PY', P = 'https://allorigins.win';
        let id = null, last = parseInt(localStorage.getItem('last')) || 0, db = JSON.parse(localStorage.getItem('db')) || {}, run = false;

        const req = async (u) => { try { const r = await fetch(P + encodeURIComponent(u)); return r.ok ? await r.json() : null; } catch { return null; } };
        const save = () => { localStorage.setItem('db', JSON.stringify(db)); localStorage.setItem('last', last); };
        const go = (s) => { document.body.classList.toggle('view-chat', s); if(!s) id = null; };

        function renderMsg(t, txt) { const d = document.createElement('div'); d.className = `msg ${t}`; d.innerText = txt; box.appendChild(d); box.scrollTop = box.scrollHeight; }

        function openChat(cId) { id = cId; go(1); title.innerText = db[id].name; box.innerHTML = ''; db[id].msgs.forEach(m => renderMsg(m.t, m.x)); }

        function addList(cId, name) {
            let el = document.querySelector(`[data-id="${cId}"]`);
            if (!el) {
                el = document.createElement('div'); el.className = 'item'; el.setAttribute('data-id', cId);
                el.onclick = () => openChat(cId); list.insertBefore(el, list.firstChild);
            }
            const lastM = db[cId].msgs[db[cId].msgs.length - 1]?.x || '';
            el.innerHTML = `<b>${name}</b><p style="font-size:12px;color:#8a8a8a">${lastM.substring(0,25)}</p>`;
        }

        async function loop() {
            if (run) return; run = true;
            const res = await req(`https://telegram.org{T}/getUpdates?offset=${last + 1}&timeout=1`);
            if (res) {
                const data = JSON.parse(res.contents);
                if (data?.result?.length) data.result.forEach(u => {
                    last = u.update_id;
                    if (u.message?.text) {
                        const cid = u.message.chat.id, name = u.message.from.first_name || 'User';
                        if (!db[cid]) db[cid] = { name, msgs: [] };
                        db[cid].msgs.push({ t: 'incoming', x: u.message.text }); addList(cid, name);
                        if (String(id) === String(cid)) renderMsg('incoming', u.message.text);
                    }
                }); save();
            } run = false;
        }

        async function send() {
            const txt = inp.value.trim(); if (!txt || !id) return;
            inp.value = '';
            const res = await req(`https://telegram.org{T}/sendMessage?chat_id=${id}&text=${encodeURIComponent(txt)}`);
            if (res) {
                db[id].msgs.push({ t: 'outgoing', x: txt }); renderMsg('outgoing', txt); addList(id, db[id].name); save();
            } else alert('Ошибка');
        }

        Object.keys(db).forEach(c => addList(c, db[c].name));
        setInterval(loop, 2500);
    </script>
</body>
</html>
