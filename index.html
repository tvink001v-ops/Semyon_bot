<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Бот</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body, html { height: 100%; overflow: hidden; background-color: #ffffff; }
        .app-container { display: flex; width: 200vw; height: 100%; transition: transform 0.25s ease-in-out; }
        .screen-contacts { width: 100vw; height: 100%; display: flex; flex-direction: column; background: white; }
        .header { height: 60px; background: #507299; color: white; display: flex; align-items: center; padding: 0 20px; font-weight: bold; font-size: 18px; }
        .contacts-list { flex: 1; overflow-y: auto; }
        .contact-item { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid #f0f2f5; cursor: pointer; }
        .avatar { width: 48px; height: 48px; background: #6c7a89; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; font-size: 16px; }
        .contact-details b { font-size: 16px; color: #000; }
        .contact-details p { font-size: 13px; color: #8a8a8a; margin-top: 2px; }
        .screen-chat { width: 100vw; height: 100%; display: flex; flex-direction: column; background-color: #f4f4f5; }
        .chat-header { height: 60px; background: white; border-bottom: 1px solid #dadde1; display: flex; align-items: center; padding: 0 10px; font-weight: bold; }
        .back-btn { background: none; border: none; font-size: 24px; color: #507299; padding: 10px; cursor: pointer; }
        .messages-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; }
        .message.incoming { background: white; align-self: flex-start; border-top-left-radius: 4px; }
        .message.outgoing { background: #effdde; align-self: flex-end; border-top-right-radius: 4px; }
        .input-area { background: white; padding: 10px 15px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #dadde1; }
        .input-area input { flex: 1; padding: 12px 16px; border: 1px solid #dbdbdb; border-radius: 24px; outline: none; font-size: 15px; background: #f9f9f9; }
        .input-area button { background: #4a90e2; color: white; border: none; padding: 10px 18px; border-radius: 24px; cursor: pointer; font-weight: bold; }
        .view-chat .app-container { transform: translateX(-100vw); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="screen-contacts">
            <div class="header">Сообщения</div>
            <div class="contacts-list" id="contactsList"></div>
        </div>
        <div class="screen-chat">
            <div class="chat-header">
                <button class="back-btn" onclick="goBack()">←</button>
                <div id="currentChatName">Чат</div>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Сообщение..." onkeydown="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()">Отп.</button>
            </div>
        </div>
    </div>

    <script>
        // ВАШ НОВЫЙ ТОКЕН (вставьте тот, который получили в BotFather)
        const BOT_TOKEN = 'СЮДА_ВСТАВЬТЕ_НОВЫЙ_ТОКЕН';
        
        // Рабочий прокси для GitHub Pages
        const PROXY = 'https://api.codetabs.com/v1/proxy?quest=';

        let currentChatId = null;
        let lastUpdateId = parseInt(localStorage.getItem('lastUpdateId'), 10) || 0;
        let chatsData = JSON.parse(localStorage.getItem('chatsData')) || {};
        let polling = false;

        function saveToStorage() {
            localStorage.setItem('chatsData', JSON.stringify(chatsData));
            localStorage.setItem('lastUpdateId', String(lastUpdateId));
        }

        function initData() {
            Object.keys(chatsData).forEach(chatId => {
                addContactToList(chatId, chatsData[chatId].name);
            });
        }

        async function checkNewMessages() {
            if (polling || BOT_TOKEN.includes('СЮДА_ВСТАВЬТЕ')) return;
            polling = true;
            
            const targetUrl = `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=1`;
            const url = PROXY + encodeURIComponent(targetUrl);
            
            try {
                const response = await fetch(url);
                if (!response.ok) return;
                const data = await response.json();

                if (Array.isArray(data.result) && data.result.length > 0) {
                    data.result.forEach(update => {
                        lastUpdateId = update.update_id;
                        if (update.message && update.message.text) {
                            const chatId = update.message.chat.id;
                            const username = update.message.from.first_name || 'Пользователь';
                            const text = update.message.text;

                            if (!chatsData[chatId]) chatsData[chatId] = { name: username, messages: [] };
                            chatsData[chatId].messages.push({ type: 'incoming', text });
                            addContactToList(chatId, username);
                            if (String(currentChatId) === String(chatId)) renderMessage('incoming', text);
                        }
                    });
                    saveToStorage();
                }
            } catch (error) {
                console.error('Ошибка:', error);
            } finally {
                polling = false;
            }
        }

        function addContactToList(chatId, username) {
            const list = document.getElementById('contactsList');
            let item = document.querySelector(`[data-chat-id="${chatId}"]`);
            const lastMsg = chatsData[chatId].messages[chatsData[chatId].messages.length - 1]?.text || '';
            
            if (!item) {
                item = document.createElement('div');
                item.className = 'contact-item';
                item.setAttribute('data-chat-id', chatId);
                list.insertBefore(item, list.firstChild);
            }
            item.innerHTML = `
                <div class="avatar">${username.substring(0, 2).toUpperCase()}</div>
                <div class="contact-details"><b>${username}</b><p>${lastMsg.substring(0, 30)}</p></div>
            `;
            item.onclick = () => selectChat(chatId);
        }

        function selectChat(chatId) {
            currentChatId = chatId;
            document.body.classList.add('view-chat');
            document.getElementById('currentChatName').innerText = chatsData[chatId].name;
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            chatsData[chatId].messages.forEach(msg => renderMessage(msg.type, msg.text));
        }

        function goBack() {
            document.body.classList.remove('view-chat');
            currentChatId = null;
        }

        function renderMessage(type, text) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentChatId || BOT_TOKEN.includes('СЮДА_ВСТАВЬТЕ')) return;

            const targetUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${currentChatId}&text=${encodeURIComponent(text)}`;
            const url = PROXY + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(url);
                if (response.ok) {
                    chatsData[currentChatId].messages.push({ type: 'outgoing', text });
                    renderMessage('outgoing', text);
                    addContactToList(currentChatId, chatsData[currentChatId].name);
                    input.value = '';
                    saveToStorage();
                }
            } catch (error) {
                alert('Ошибка отправки');
            }
        }

        initData();
        setInterval(checkNewMessages, 2000);
    </script>
</body>
</html>
